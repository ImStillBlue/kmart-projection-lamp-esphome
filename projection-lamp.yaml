# Kmart (Anko) RGB Projection Lamp - ESP32-C3 Super Mini
# Replaces the IR controller chip (U1). The C3 drives the lamp's own
# three AO3400A MOSFET gates with PWM.

substitutions:
  # Colour order as tested on my unit with Q1 -> pad 5, Q2 -> pad 6,
  # Q3 -> pad 7. Swap these if your colours come out wrong (see README).
  pin_red: GPIO6
  pin_green: GPIO5
  pin_blue: GPIO7

esphome:
  name: projection-lamp
  friendly_name: Projection Lamp

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # On ESPHome 2026.11 or newer you can replace this line with a bare
    # "encryption:" to reuse the API key instead of a separate password.
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Many Super Mini boards have a poorly matched antenna and connect more
  # reliably at reduced power. Raise or delete this line if range is poor.
  output_power: 8.5dB
  ap:
    ssid: "Projection Lamp Fallback"
    password: !secret fallback_ap_password

captive_portal:

output:
  # 4882 Hz is the highest frequency that keeps the C3's full 14-bit depth.
  - platform: ledc
    id: out_red
    pin: ${pin_red}
    frequency: 4882 Hz
  - platform: ledc
    id: out_green
    pin: ${pin_green}
    frequency: 4882 Hz
  - platform: ledc
    id: out_blue
    pin: ${pin_blue}
    frequency: 4882 Hz

light:
  - platform: rgb
    id: lamp
    name: None            # entity takes the device name: "Projection Lamp"
    red: out_red
    green: out_green
    blue: out_blue
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 400ms
    effects:
      - lambda:
          name: Colour Cycle
          update_interval: 50ms
          lambda: |-
            static int hue = 0;
            hue = (hue + 1) % 360;
            float r, g, b;
            hsv_to_rgb(hue, 1.0f, 1.0f, r, g, b);
            auto call = id(lamp).turn_on();
            call.set_rgb(r, g, b);
            call.set_transition_length(50);
            call.set_publish(false);
            call.set_save(false);
            call.perform();
      - random:
          name: Slow Random
          transition_length: 5s
          update_interval: 7s
      - pulse:
          name: Breathe
          transition_length: 2s
          update_interval: 2s
      - strobe:
          name: Strobe
      - flicker:
          name: Candle
          alpha: 95%
          intensity: 3%

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

button:
  - platform: restart
    name: Restart
