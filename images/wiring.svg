<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Five wires join the C3 to the lamp board">
  <rect width="760" height="356" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Five wires join the C3 to the lamp board</text>
  <rect x="24" y="52" width="220" height="260" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="40" y="78" font-size="14" font-weight="600" fill="#1f2328">ESP32-C3 Super Mini</text>
  <rect x="420" y="52" width="316" height="260" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="436" y="78" font-size="14" font-weight="600" fill="#1f2328">Lamp LED board</text>
  <g fill="#1f2328">
    <text x="228" y="120" text-anchor="end">pad 5V</text>
    <text x="228" y="160" text-anchor="end">pad G</text>
    <text x="228" y="208" text-anchor="end">pad 5 (GPIO5)</text>
    <text x="228" y="248" text-anchor="end">pad 6 (GPIO6)</text>
    <text x="228" y="288" text-anchor="end">pad 7 (GPIO7)</text>
    <text x="436" y="120">Pad A, marked +: +5 V</text>
    <text x="436" y="160">Pad B: ground</text>
    <text x="436" y="208">G1: Q1 gate, bottom-left leg</text>
    <text x="436" y="248">G2: Q2 gate, bottom-left leg</text>
    <text x="436" y="288">G3: Q3 gate, bottom-left leg</text>
  </g>
  <g stroke="#8c959f" stroke-width="2" fill="#8c959f">
    <line x1="244" y1="116" x2="420" y2="116"/><circle cx="244" cy="116" r="4"/><circle cx="420" cy="116" r="4"/>
    <line x1="244" y1="156" x2="420" y2="156"/><circle cx="244" cy="156" r="4"/><circle cx="420" cy="156" r="4"/>
  </g>
  <g stroke="#0969da" stroke-width="2" fill="#0969da">
    <line x1="244" y1="204" x2="420" y2="204"/><circle cx="244" cy="204" r="4"/><circle cx="420" cy="204" r="4"/>
    <line x1="244" y1="244" x2="420" y2="244"/><circle cx="244" cy="244" r="4"/><circle cx="420" cy="244" r="4"/>
    <line x1="244" y1="284" x2="420" y2="284"/><circle cx="244" cy="284" r="4"/><circle cx="420" cy="284" r="4"/>
  </g>
  <g font-size="11.5" fill="#59636e" text-anchor="middle">
    <text x="332" y="108">5 V</text>
    <text x="332" y="148">ground</text>
    <text x="332" y="196">PWM (green)</text>
    <text x="332" y="236">PWM (red)</text>
    <text x="332" y="276">PWM (blue)</text>
  </g>
  <text x="24" y="340" font-size="11.5" fill="#59636e">U1 is removed. Colours are as found on the author's unit; check yours before trusting them.</text>
</svg>
